<section id="home"><h1>Turkish Practice</h1><div id="err" class="error hidden"></div><div class="card"><h2>Choose practice mode</h2><p class="muted">Load one CSV bank, then use it for either solo practice or two-player practice.</p>

</div><script>

$("game").addEventListener("click",e=>{if(phase==="result"&&!e.target.closest("#exit,#more,#menu"))next()});let touch=null;$("game").addEventListener("touchstart",e=>{if(phase==="result"&&e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$("game").addEventListener("touchend",e=>{if(phase!=="result"||!touch)return;let t=e.changedTouches[0],d=Math.hypot(t.clientX-touch.x,t.clientY-touch.y);touch=null;if(d>35)next()},{passive:true});$("more").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("hidden")};$("menuExit").onclick=e=>{e.stopPropagation();$("menu").classList.add("hidden");$("dlg").showModal()};$("exit").onclick=()=>$("dlg").showModal();$("cancel").onclick=()=>$("dlg").close();$("yes").onclick=()=>{$("dlg").close();$("game").classList.add("hidden");$("home").classList.remove("hidden");score=[0,0];cur=null};

$("soloStart").onclick=()=>{soloOrder=soloShuffle();soloPos=0;soloCur=null;$("home").classList.add("hidden");$("soloGame").classList.remove("hidden");soloNextQ()};
$("soloExit").onclick=()=>{$("soloGame").classList.add("hidden");$("home").classList.remove("hidden")};
function soloNextQ(){let old=soloCur?.id||null;if(soloPos>=soloOrder.length){soloOrder=soloShuffle(old);soloPos=0}soloCur=bank[soloOrder[soloPos++]];soloAnswered=false;$("soloFeedback").className="soloFeedback hidden";$("soloFeedback").innerHTML="";$("soloMeta").replaceChildren();[soloCur.level,soloCur.difficulty,soloCur.type,soloCur.topic,soloCur.concept].forEach(t=>{let s=document.createElement("span");s.textContent=t;$("soloMeta").append(s)});$("soloQ").textContent=soloCur.question;$("soloOpts").replaceChildren();L.forEach(l=>{let b=document.createElement("button");b.type="button";b.className="soloOpt";b.textContent=otSolo(l);b.onclick=()=>soloAnswer(l,b);$("soloOpts").append(b)})}
const otSolo=l=>soloCur["option_"+l.toLowerCase()],ftSolo=l=>soloCur["feedback_"+l.toLowerCase()];
function soloAnswer(l,b){if(soloAnswered)return;soloAnswered=true;[...$("soloOpts").children].forEach((x,i)=>{x.disabled=true;if(L[i]===soloCur.correct)x.classList.add("answer")});let ok=l===soloCur.correct;b.classList.add(ok?"correct":"wrong");let box=$("soloFeedback"),title=document.createElement("strong"),p=document.createElement("p");title.textContent=ok?"Correct":"Not quite";p.textContent=ftSolo(l);box.replaceChildren(title,p);box.className="soloFeedback "+(ok?"good":"bad");if(!ok){let c=document.createElement("p");c.textContent="Correct answer: "+otSolo(soloCur.correct)+" — "+ftSolo(soloCur.correct);box.append(c)}}


let soloTouch=null;
$("soloGame").addEventListener("click",e=>{if(soloAnswered&&!e.target.closest("#soloExit")&&!e.target.closest(".soloOpt"))soloNextQ()});
$("soloGame").addEventListener("touchstart",e=>{if(soloAnswered&&e.touches.length===1)soloTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$("soloGame").addEventListener("touchend",e=>{if(!soloAnswered||!soloTouch)return;let t=e.changedTouches[0],d=Math.hypot(t.clientX-soloTouch.x,t.clientY-soloTouch.y);soloTouch=null;if(d>35)soloNextQ()},{passive:true});
})();
</script><script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
